<main class="page">
  <div class="container">
    <section class="contact-hero">
      <h1>Say Hello.</h1>
      <p>Want to work together? Awesome! Send me a quick message.</p>

      <!-- FORMSPREE: replace YOUR_FORM_ID with your actual Formspree form ID -->
      <form id="contact-form" class="contact-form" action="https://formspree.io/f/xdavopwk" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="form-submit">Send Message</button>
        <div class="form-success">
          Thanks! Your message has been sent. I'll get back to you soon.
        </div>
      </form>
    </section>
  </div>
